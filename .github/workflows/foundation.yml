name: Foundation

on:
  pull_request:
  push:
    branches: [main, feature/sprints-1-2-landing-core, feature/sprints-2-3-visual-integration, feature/sprints-4-5-release-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Generate types and typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and responsive tests
        run: npm run test:e2e
      - name: Lighthouse measurements
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/globows-lighthouse-server.log 2>&1 &
          QA_SERVER_PID=$!
          trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          npm run audit:lighthouse -- ci
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-browser-evidence
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .visual-evidence/lighthouse/ci/
          retention-days: 7
