name: Foundation

on:
  pull_request:
  push:
    branches: [main, feature/sprints-1-2-landing-core, feature/sprints-2-3-visual-integration]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Generate types and typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and responsive tests
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
